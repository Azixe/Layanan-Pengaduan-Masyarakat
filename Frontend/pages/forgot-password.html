<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lupa Password - LaporDesa</title>
    <link rel="icon" type="image/png" href="../img/67fdchchgc.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/login.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card" role="main">
            <h1 class="title" id="forgotTitle">Lupa Password?</h1>
            <p class="subtitle" id="forgotSubtitle">Masukkan email Anda untuk menerima kode verifikasi reset password.</p>

            <form id="forgotPasswordForm" novalidate>
                <!-- Step 1: input email -->
                <div class="field" id="stepEmail">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="masukan email terdaftar" required>
                    <small class="error" id="emailError" aria-live="polite"></small>
                </div>

                <!-- Step 2: input kode + password baru -->
                <div id="stepCode" style="display: none;">
                    <div class="field">
                        <label for="code">Kode Verifikasi</label>
                        <input type="text" id="code" name="code" placeholder="masukan kode 6 digit" maxlength="6">
                        <small class="error" id="codeError" aria-live="polite"></small>
                    </div>

                    <div class="field">
                        <label for="newPassword">Password Baru</label>
                        <input type="password" id="newPassword" name="newPassword" placeholder="minimal 8 karakter">
                        <small class="error" id="newPasswordError" aria-live="polite"></small>
                    </div>

                    <div class="field">
                        <label for="confirmPassword">Konfirmasi Password Baru</label>
                        <input type="password" id="confirmPassword" name="confirmPassword" placeholder="ulangi password baru">
                        <small class="error" id="confirmPasswordError" aria-live="polite"></small>
                    </div>
                </div>

                <button type="submit" class="btn" id="submitForgot">Kirim Kode</button>

                <div class="links">
                    <a href="login.html" id="backToLogin">Kembali ke Login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/forgot-password.js"></script>
</body>

</html>
